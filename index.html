<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>演员合作力导向图 · 数据可视化</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root{
    --stage-bg-1:#0c1224;
    --stage-bg-2:#04060e;
    --panel-bg:#0f1421;
    --panel-bg-2:#161c2c;
    --hairline:rgba(94,213,212,0.14);
    --gold:#e8b96e;
    --gold-soft:rgba(232,185,110,0.55);
    --gold-dim:rgba(232,185,110,0.12);
    --teal:#5eead4;
    --teal-soft:rgba(94,213,212,0.55);
    --teal-dim:rgba(94,213,212,0.12);
    --coral:#ef7b7b;
    --coral-soft:rgba(239,123,123,0.55);
    --ink:#eef2f7;
    --ink-dim:#8a93a8;
    --ink-faint:#555c6e;
    --lead-red:#ef7b7b;
    --support-gray:#5b6478;
    --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
    display:flex;
    height:100vh;
    overflow:hidden;
    font-family:"Noto Sans SC",sans-serif;
    background:var(--stage-bg-2);
}

/* ============ 左侧面板 ============ */
.left-panel-wrap{
    position:relative;
    display:flex;
    flex-direction:column;
    width:44px;
    background:var(--panel-bg);
    border-right:1px solid var(--hairline);
    transition:width 0.38s cubic-bezier(.65,0,.35,1);
    overflow:hidden;
    z-index:5;
}
.left-panel-wrap.expand{
    width:340px;
}

.toggle-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    height:44px;
    min-height:44px;
    background:linear-gradient(180deg,var(--panel-bg-2),var(--panel-bg));
    color:var(--gold);
    cursor:pointer;
    user-select:none;
    border-bottom:1px solid var(--hairline);
    font-size:13px;
    letter-spacing:1px;
    white-space:nowrap;
}
.toggle-bar:hover{ background:var(--gold-dim); }
.reel{
    width:16px;height:16px;border-radius:50%;
    border:2px solid var(--gold);
    position:relative;
    flex:none;
}
.reel::before,.reel::after{
    content:"";
    position:absolute;
    width:3px;height:3px;
    background:var(--gold);
    border-radius:50%;
}
.reel::before{ top:1px; left:5px; }
.reel::after{ bottom:1px; right:5px; }

.left-panel{
    padding:20px 18px 16px;
    display:flex;
    flex-direction:column;
    gap:18px;
    height:calc(100% - 44px);
    overflow-y:auto;
}
.left-panel::-webkit-scrollbar{ width:6px; }
.left-panel::-webkit-scrollbar-thumb{ background:var(--hairline); border-radius:3px; }

.brand{ display:flex; flex-direction:column; gap:4px; }
.brand h1{
    font-family:"Noto Serif SC",serif;
    font-weight:700;
    font-size:20px;
    color:var(--ink);
    letter-spacing:1px;
}
.brand p{
    font-size:11.5px;
    color:var(--ink-faint);
    letter-spacing:2px;
    text-transform:uppercase;
}

.divider{ height:1px; background:var(--hairline); border:none; }

/* 统计卡片 */
.stats-row{ display:flex; gap:10px; }
.stat-card{
    flex:1;
    background:var(--panel-bg-2);
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    padding:10px 12px;
}
.stat-card .num{
    font-family:"JetBrains Mono",monospace;
    font-size:22px;
    font-weight:600;
    color:var(--gold);
    line-height:1.1;
}
.stat-card .label{
    margin-top:4px;
    font-size:11px;
    color:var(--ink-dim);
    letter-spacing:0.5px;
}

/* 区块标题 */
.section-title{
    font-size:11.5px;
    color:var(--ink-faint);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:2px;
}

/* 搜索框 */
.search-wrap{ position:relative; }
.search-wrap input{
    width:100%;
    height:38px;
    background:var(--panel-bg-2);
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    color:var(--ink);
    font-size:13px;
    padding:0 34px 0 12px;
    outline:none;
    transition:border-color .2s;
}
.search-wrap input::placeholder{ color:var(--ink-faint); }
.search-wrap input:focus{ border-color:var(--gold-soft); }
.search-wrap .clear-x{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    color:var(--ink-faint); cursor:pointer; font-size:15px; display:none;
}
.search-wrap .clear-x.show{ display:block; }
.search-hint{ font-size:11px; color:var(--ink-faint); }

/* 图例 */
.legend-list{ display:flex; flex-direction:column; gap:9px; }
.legend-item{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-dim); }
.legend-swatch{ flex:none; width:22px; height:0; border-top-width:4px; border-top-style:solid; border-radius:2px; }
.legend-swatch.lead{ border-color:var(--gold); }
.legend-swatch.support{ border-color:rgba(232,185,110,0.45); }
.legend-dot-scale{
    flex:none;
    display:flex; align-items:center; gap:4px;
}
.legend-dot-scale span{ border-radius:50%; background:linear-gradient(135deg,var(--teal),var(--gold),var(--coral)); display:block; }
.legend-dot-scale span:nth-child(1){ width:8px; height:8px; }
.legend-dot-scale span:nth-child(2){ width:13px; height:13px; }
.legend-dot-scale span:nth-child(3){ width:19px; height:19px; }

/* 按钮 */
button{
    width:100%;
    height:40px;
    border:1px solid var(--gold-soft);
    border-radius:var(--radius);
    cursor:pointer;
    font-size:13.5px;
    letter-spacing:1px;
    background:transparent;
    color:var(--gold);
    transition:background .2s, color .2s, border-color .2s;
    font-family:"Noto Sans SC",sans-serif;
}
#reloadBtn:hover{ background:var(--gold); color:#1b1305; }

/* 筛选按钮组 */
.filter-group{ display:flex; gap:8px; }
.filter-btn{
    flex:1;
    height:36px;
    border:1px solid var(--teal-soft);
    border-radius:var(--radius);
    background:transparent;
    color:var(--teal);
    font-size:12px;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:background .2s, color .2s, border-color .2s;
    font-family:"Noto Sans SC",sans-serif;
}
.filter-btn:hover{ background:var(--teal-dim); }
.filter-btn.active{
    background:var(--teal);
    color:#06231f;
    border-color:var(--teal);
    box-shadow:0 0 14px rgba(94,213,212,0.45);
}
.filter-hint{ font-size:11px; color:var(--ink-faint); margin-top:6px; line-height:1.6; }

.desc{
    font-size:11.5px;
    color:var(--ink-faint);
    line-height:1.9;
}
.desc b{ color:var(--ink-dim); font-weight:500; }

.panel-footer{
    margin-top:auto;
    font-size:10.5px;
    color:var(--ink-faint);
    line-height:1.7;
    border-top:1px solid var(--hairline);
    padding-top:12px;
}

/* ============ 舞台 / 图表区 ============ */
.stage{
    position:relative;
    flex:1;
    height:100%;
    background:
        radial-gradient(ellipse 70% 60% at 50% 42%, rgba(94,213,212,0.06), transparent 70%),
        radial-gradient(ellipse 120% 90% at 50% 50%, var(--stage-bg-1), var(--stage-bg-2));
}
.stage::before{
    /* 舞台聚光灯竖向暗角 */
    content:"";
    position:absolute; inset:0;
    box-shadow:inset 0 0 140px 40px rgba(0,0,0,0.55);
    pointer-events:none;
    z-index:2;
}
#chart{ position:absolute; inset:0; }

.empty-state{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column;
    gap:10px;
    color:var(--ink-faint);
    font-size:13px;
    z-index:3;
}
.empty-state.show{ display:flex; }
.empty-state .title{ color:var(--ink-dim); font-size:15px; font-family:"Noto Serif SC",serif; }
</style>
</head>
<body>

<div class="left-panel-wrap" id="panelWrap">
    <div class="toggle-bar" id="toggleBtn">
        <span class="reel"></span>
        <span id="toggleLabel"></span>
    </div>
    <div class="left-panel">
        <div class="brand">
            <h1>演员合作网络</h1>
            <p>Collaboration Graph</p>
        </div>

        <hr class="divider">

        <div class="stats-row">
            <div class="stat-card">
                <div class="num" id="statActors">--</div>
                <div class="label">演员总数</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statLinks">--</div>
                <div class="label">合作关系</div>
            </div>
        </div>

        <div>
            <div class="section-title">查找演员</div>
            <div class="search-wrap" style="margin-top:8px;">
                <input type="text" id="searchInput" placeholder="输入姓名，高亮其合作网络">
                <span class="clear-x" id="clearSearch">✕</span>
            </div>
            <div class="search-hint" id="searchHint" style="margin-top:6px;"></div>
        </div>

        <div>
            <div class="section-title">图例</div>
            <div class="legend-list" style="margin-top:10px;">
                <div class="legend-item"><span class="legend-swatch lead"></span>双主角合作作品</div>
                <div class="legend-item"><span class="legend-swatch support"></span>含配角的合作</div>
                <div class="legend-item">
                    <span class="legend-dot-scale"><span></span><span></span><span></span></span>
                    节点大小 = 参演作品数
                </div>
                <div class="legend-item">
                    <span class="legend-swatch" style="border-color:var(--teal); border-top-width:5px;"></span>
                    多次合作高亮
                </div>
            </div>
        </div>

        <hr class="divider">

        <div>
            <div class="section-title">合作次数筛选</div>
            <div class="filter-group" style="margin-top:10px;">
                <button class="filter-btn active" data-threshold="0">全部</button>
                <button class="filter-btn" data-threshold="2" data-mode="eq">2 次</button>
                <button class="filter-btn" data-threshold="3" data-mode="gte">≥3 次</button>
            </div>
            <div class="filter-hint" id="filterHint">高亮多次合作的演员与作品边</div>
        </div>

        <hr class="divider">

        <button id="reloadBtn">重载图表</button>

        <div class="desc">
            <b>说明</b><br>
            数据从同目录 data.json 读取，修改后点击「重载图表」。<br><br>
            · 双人多部合作自动散开曲线，避免重叠<br>
            · 悬停节点可聚焦其合作关系，其余变暗<br>
            · 连线文字为合作作品名<br>
            · 滚轮缩放，拖拽平移
        </div>

        <div class="panel-footer">
            需通过本地 Web 服务打开（非 file://），否则读取 data.json 会跨域失败。
        </div>
    </div>
</div>

<div class="stage">
    <div id="chart"></div>
    <div class="empty-state" id="emptyState">
        <div class="title">暂无数据</div>
        <div>请检查 data.json 是否与本页面位于同一目录</div>
    </div>
</div>

<script>
const chartDom = document.getElementById('chart');
const myChart = echarts.init(chartDom);
const panelWrap = document.getElementById('panelWrap');
const toggleBtn = document.getElementById('toggleBtn');
const toggleLabel = document.getElementById('toggleLabel');
const emptyState = document.getElementById('emptyState');
let isCollapse = true;

function setToggleLabel(){
    toggleLabel.textContent = isCollapse ? '' : '折叠面板 ◀';
}
setToggleLabel();

toggleBtn.addEventListener('click', ()=>{
    isCollapse = !isCollapse;
    panelWrap.classList.toggle('expand', !isCollapse);
    setToggleLabel();
    setTimeout(()=>myChart.resize(), 400);
});

let nodesCache = [];
let linksCache = [];
let adjacencyCache = new Map();
let pairMapCache = new Map();
let focusedName = null;
let filterThreshold = 0;
let filterMode = 'gte';

// 读取外部json并渲染
async function loadAndRender() {
    try {
        const res = await fetch("./data.json");
        if (!res.ok) throw new Error("读取data.json失败，请确保文件和html同目录，用本地服务打开");
        const data = await res.json();
        if(!data.actors || !data.actors.length){
            emptyState.classList.add('show');
            return;
        }
        emptyState.classList.remove('show');
        renderGraph(data.actors, data.links || []);
    } catch (err) {
        emptyState.classList.add('show');
        alert("加载外部数据失败：" + err.message + "\n提示：直接打开本地文件会跨域，需要用本地web服务运行");
        console.error(err);
    }
}

function renderGraph(rawActors, rawLinks){
    // 统计参演作品数
    const workCount = {};
    rawActors.forEach(item=>workCount[item.name]=0);
    rawLinks.forEach(link=>{
        workCount[link.source] = (workCount[link.source]||0) + 1;
        workCount[link.target] = (workCount[link.target]||0) + 1;
    });

    // 生成节点尺寸 + 数值（用于颜色映射）
    const nodes = rawActors.map(actor=>{
        const cnt = workCount[actor.name] || 0;
        const size = Math.min(28 + cnt * 11, 88);
        return {
            name: actor.name,
            symbolSize: size,
            value: cnt,
            totalWork: cnt,
            itemStyle: {
            color: "transparent" // 节点创建时直接镂空，首次渲染生效
        },
        label:{
            fontSize: Math.min(11 + cnt, 16)
        }
        }
    });
    nodesCache = nodes;
    // 快照每个节点的初始 label / itemStyle，供高亮/筛选/搜索复位使用
    nodes.forEach(n=>{
        n._baseLabel = { show:true, fontSize:n.label.fontSize };
        n._baseItemStyle = Object.assign({}, n.itemStyle);
    });

    // 更新统计面板
    document.getElementById('statActors').textContent = nodes.length;
    document.getElementById('statLinks').textContent = rawLinks.length;

    // 同组演员分配差异化曲率防重叠
    const pairMap = new Map();
    rawLinks.forEach((link, idx)=>{
        const names = [link.source, link.target].sort();
        const key = names.join('|');
        if(!pairMap.has(key)) pairMap.set(key, []);
        pairMap.get(key).push(idx);
    });

    const curveConfig = {};
    pairMap.forEach((indexList, key)=>{
        const len = indexList.length;
        if(len === 1){
            curveConfig[key] = [0.12];
        }else{
            const maxCurve = 0.42;
            const step = maxCurve * 2 / (len - 1);
            const curves = [];
            for(let i=0;i<len;i++){
                curves.push(-maxCurve + i * step);
            }
            curveConfig[key] = curves;
        }
    });

    // 组装连线样式（统一金色 + 金色辉光，宽度/透明度区分主配角）
    const links = rawLinks.map((link, idx)=>{
        const isLead = link.sourceRole === "主役" && link.targetRole === "主役";
            const lineStyle = isLead
        ? { width:5.5, color:"#e8b96e", opacity:0.85, shadowBlur:8, shadowColor:"rgba(232,185,110,0.55)" }
        : { width:3.2, color:"#e8b96e", opacity:0.6, shadowBlur:5, shadowColor:"rgba(232,185,110,0.35)" };

        const names = [link.source, link.target].sort();
        const key = names.join('|');
        const arr = pairMap.get(key);
        const pos = arr.indexOf(idx);
        lineStyle.curveness = curveConfig[key][pos];
        return {...link, lineStyle, _baseLineStyle: Object.assign({}, lineStyle)}
    });
    linksCache = links;

    // 构建邻接表，供搜索高亮使用
    adjacencyCache = new Map();
    links.forEach(l=>{
        if(!adjacencyCache.has(l.source)) adjacencyCache.set(l.source, new Set());
        if(!adjacencyCache.has(l.target)) adjacencyCache.set(l.target, new Set());
        adjacencyCache.get(l.source).add(l.target);
        adjacencyCache.get(l.target).add(l.source);
    });
    pairMapCache = pairMap;

    const option = {
        backgroundColor:"transparent",
        tooltip:{
            trigger:"item",
            backgroundColor:"rgba(15,20,33,0.94)",
            borderColor:"rgba(94,213,212,0.4)",
            borderWidth:1,
            padding:[10,14],
            extraCssText:"border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.45);",
            textStyle:{ color:"#eef2f7", fontSize:12.5, fontFamily:'"Noto Sans SC",sans-serif' },
            formatter(params){
                if(params.dataType === 'node'){
                    return `<div style="font-family:'Noto Serif SC',serif;font-size:14px;color:#e8b96e;margin-bottom:4px;">${params.data.name}</div>参演作品总数：<b style="color:#eef2f7;">${params.data.totalWork}</b> 部`;
                }
                const d = params.data;
                return `<div style="font-family:'Noto Serif SC',serif;font-size:13.5px;color:#e8b96e;margin-bottom:6px;">${d.workName || '合作作品'}</div>${d.source}：${d.sourceRole || '—'}<br>${d.target}：${d.targetRole || '—'}`;
            }
        },
        animationDurationUpdate:1000,
        animationEasingUpdate:"quinticInOut",
        series:[{
            type:"graph",
            layout:"force",
            force:{ repulsion:550, edgeLength:200, gravity:0.08 },
            roam:true,
            zoom:1,
            draggable:true,
            edgeSymbol:['none','none'],
            edgeSymbolSize:[0,0],
            label:{
    show:true,
    position:"inside",
    color:"#ffffff",
    fontWeight:700,
    fontFamily:'"Noto Sans SC",sans-serif',
    textBorderColor:"rgba(232,185,110,0.9)",
    textBorderWidth:2.5,
    textShadowBlur:10,
    textShadowColor:"rgba(232,185,110,0.85)"
},
            itemStyle:{
               color: "transparent", // 内部完全镂空透明
                borderColor:"#e8b96e",
                borderWidth:4, // 圆环粗细，可自行调大/调小
                shadowBlur:18,
                shadowColor:"rgba(232,185,110,.6)"
            },
            emphasis:{
                focus:"adjacency",
                scale:1.08,
                label:{ 
    fontSize:15, 
    color:"#ffffff",
    textShadowBlur:14,
    textShadowColor:"rgba(232,185,110,1)"
},
                itemStyle:{  color: "transparent",
                            borderColor:"#f5d088", 
                            borderWidth:5  },
                lineStyle:{ width:9, opacity:1 }
            },
            blur:{
                itemStyle:{ opacity:0.15 },
                lineStyle:{ opacity:0.08 },
                label:{ opacity:0.15 }
            },
            edgeLabel:{
                show:true,
                fontSize:9.5,
                color:"#b8bdca",
                backgroundColor:"rgba(11,12,18,0.72)",
                padding:[2,5],
                borderRadius:3,
                formatter(params){ return params.data.workName || ''; },
                distance:12
            },
            data:nodes,
            links:links
        }]
    };
    myChart.setOption(option, true);

    if(filterThreshold > 0){
        applyFilter(filterThreshold, filterMode);
    }else if(focusedName){
        applyFocus(focusedName, true);
    }
}

// 合作次数筛选：高亮合作次数 == threshold（eq）或 >= threshold（gte）的演员对及其作品边
function applyFilter(threshold, mode){
    const highlightNodes = new Set();
    const highlightLinkIdx = new Set();
    pairMapCache.forEach((indexList, key)=>{
        const cnt = indexList.length;
        const hit = mode === 'eq' ? (cnt === threshold) : (cnt >= threshold);
        if(hit){
            const [a, b] = key.split('|');
            highlightNodes.add(a);
            highlightNodes.add(b);
            indexList.forEach(i=>highlightLinkIdx.add(i));
        }
    });

    const hasHighlight = highlightNodes.size > 0;

    nodesCache.forEach(n=>{
        const active = !hasHighlight || highlightNodes.has(n.name);
        n.itemStyle = Object.assign({}, n._baseItemStyle, {
            opacity: active ? 1 : 0.1,
            color: "transparent",
            borderColor: active ? "#e8b96e" : n._baseItemStyle.borderColor,
            borderWidth: active ? 5 : n._baseItemStyle.borderWidth,
            shadowBlur: active ? 24 : n._baseItemStyle.shadowBlur,
            shadowColor: active ? "rgba(232,185,110,0.9)" : n._baseItemStyle.shadowColor
        });
        n.label = Object.assign({}, n._baseLabel, {
            opacity: active ? 1 : 0.12,
            color: active ? "#ffffff" : "transparent"
        });
        n.silent = !active;
        n.emphasis = active ? undefined : { disabled:true };
        n.tooltip = active ? undefined : { show:false };
    });
    linksCache.forEach((l, idx)=>{
        const active = !hasHighlight || highlightLinkIdx.has(idx);
        l.lineStyle = Object.assign({}, l._baseLineStyle, {
            opacity: active ? 1 : 0.05,
            width: active ? (l._baseLineStyle.width + 2.5) : l._baseLineStyle.width
        });
        l.silent = !active;
        l.emphasis = active ? undefined : { disabled:true };
        l.tooltip = active ? undefined : { show:false };
        l.label = active
            ? {
                show:true,
                fontSize:12,
                fontWeight:700,
                color:"#ffffff",
                backgroundColor:"rgba(0,0,0,0.15)",
                padding:[2,6],
                borderRadius:4,
                opacity:1
            }
            : { show:true, opacity:0.05 };
    });
    myChart.setOption({ series:[{ data: nodesCache, links: linksCache }] });

    const hint = document.getElementById('filterHint');
    if(threshold === 0){
        hint.textContent = '高亮多次合作的演员与作品边';
    }else if(!hasHighlight){
        hint.textContent = mode === 'eq' ? `未找到合作恰为 ${threshold} 次的演员对` : `未找到合作 ≥ ${threshold} 次的演员对`;
    }else{
        hint.textContent = `已高亮 ${highlightNodes.size} 位演员、${highlightLinkIdx.size} 条作品边`;
    }
}

function clearFilter(){
    nodesCache.forEach(n=>{
        n.itemStyle = Object.assign({}, n._baseItemStyle);
        n.label = Object.assign({}, n._baseLabel);
        n.silent = false;
        n.emphasis = undefined;
        n.tooltip = undefined;
    });
    linksCache.forEach(l=>{
        l.lineStyle = Object.assign({}, l._baseLineStyle);
        l.silent = false;
        l.emphasis = undefined;
        l.tooltip = undefined;
        l.label = undefined;
    });
    myChart.setOption({ series:[{ data: nodesCache, links: linksCache }] });
}

// 手动按透明度实现高亮（比 dispatchAction focusNodeAdjacency 更可靠，
// 不依赖 ECharts 内部按 name 查找节点的行为）
function applyFocus(name){
    const connected = adjacencyCache.get(name) || new Set();
    nodesCache.forEach(n=>{
        const active = n.name === name || connected.has(n.name);
        n.itemStyle = Object.assign({}, n._baseItemStyle, {
            opacity: active ? 1 : 0.1,
            color: "transparent"
        });
        n.label = Object.assign({}, n._baseLabel, {
            opacity: active ? 1 : 0.12,
            color: active ? "#ffffff" : "transparent"
        });
        n.silent = !active;
        // 关键：不仅要压暗，还要彻底关闭暗淡节点的悬停响应，
        // 否则原生的 emphasis:'adjacency' 仍会在划过时把它们点亮，抢走高亮效果
        n.emphasis = active ? undefined : { disabled:true };
        n.tooltip = active ? undefined : { show:false };
    });
    linksCache.forEach(l=>{
        const active = l.source === name || l.target === name;
        l.lineStyle = Object.assign({}, l._baseLineStyle, {
            opacity: active ? l._baseLineStyle.opacity : 0.04,
            width: active ? l._baseLineStyle.width + 3.5 : l._baseLineStyle.width
        });
        l.silent = !active;
        l.emphasis = active ? undefined : { disabled:true };
        l.tooltip = active ? undefined : { show:false };
        l.label = active
            ? {
                show:true,
                fontSize:13,
                fontWeight:700,
                color:"#06231f",
                backgroundColor:"#5eead4",
                padding:[3,8],
                borderRadius:4,
                opacity:1
            }
            : { show:true, opacity:0.05 };
    });
    myChart.setOption({ series:[{ data: nodesCache, links: linksCache }] });
}

function clearFocus(){
    nodesCache.forEach(n=>{
        n.itemStyle = Object.assign({}, n._baseItemStyle);
        n.label = Object.assign({}, n._baseLabel);
        n.silent = false;
        n.emphasis = undefined;
        n.tooltip = undefined;
    });
    linksCache.forEach(l=>{
        l.lineStyle = Object.assign({}, l._baseLineStyle);
        l.silent = false;
        l.emphasis = undefined;
        l.tooltip = undefined;
        l.label = undefined;
    });
    myChart.setOption({ series:[{ data: nodesCache, links: linksCache }] });
}

// 搜索交互
const searchInput = document.getElementById('searchInput');
const clearSearch = document.getElementById('clearSearch');
const searchHint = document.getElementById('searchHint');

searchInput.addEventListener('input', (e)=>{
    const val = e.target.value.trim();
    clearSearch.classList.toggle('show', !!val);
    if(val){
        // 输入搜索时取消筛选，避免相互冲突
        if(filterThreshold !== 0){
            setFilterThreshold(0);
        }
    }
    if(!val){
        clearFocus();
        focusedName = null;
        searchHint.textContent = '';
        return;
    }
    const match = nodesCache.find(n=>n.name.includes(val));
    if(match){
        focusedName = match.name;
        applyFocus(match.name);
        searchHint.textContent = `已聚焦「${match.name}」的合作网络`;
    }else{
        clearFocus();
        focusedName = null;
        searchHint.textContent = '未找到匹配演员';
    }
});

clearSearch.addEventListener('click', ()=>{
    searchInput.value = '';
    searchInput.dispatchEvent(new Event('input'));
    searchInput.focus();
});

// 重载按钮
document.getElementById('reloadBtn').addEventListener('click', loadAndRender);

// 筛选按钮
function setFilterThreshold(t, mode){
    filterThreshold = t;
    filterMode = mode || 'gte';
    document.querySelectorAll('.filter-btn').forEach(btn=>{
        btn.classList.toggle('active', Number(btn.dataset.threshold) === t);
    });
    if(t === 0){
        clearFilter();
        document.getElementById('filterHint').textContent = '高亮多次合作的演员与作品边';
    }else{
        // 切换到筛选时，清空搜索
        if(searchInput.value){
            searchInput.value = '';
            clearSearch.classList.remove('show');
            searchHint.textContent = '';
            focusedName = null;
        }
        applyFilter(t, filterMode);
    }
}
document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
        const t = Number(btn.dataset.threshold);
        const m = btn.dataset.mode || 'gte';
        setFilterThreshold(t, m);
    });
});

// 页面初始化加载数据
window.addEventListener('load', loadAndRender);
window.addEventListener('resize', ()=>myChart.resize());
</script>
